apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: huzaifa678/${{ values.name }}
    argocd/app-name: ${{ values.name }}-dev
    backstage.io/kubernetes-label-selector: app=${{ values.name }}
    backstage.io/kubernetes-namespace: saas-apps
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: saas-services
