apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service
  title: New Microservice (golden path)
  description: >-
    Scaffold a production-ready microservice chart — a full copy of the standard
    chart (Argo Rollout + canary analysis, KEDA, Istio, probes, values.schema.json)
    with the service name wired in — plus its catalog-info.yaml, opened as a PR to
    SAAS-Continious-Delivery. One manual step remains: add the service to the
    `microservices` ApplicationSet list (shown in the PR body).
  tags:
    - microservice
    - helm
    - golden-path
    - gitops
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service
      required:
        - name
        - description
        - imageRepository
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase DNS name ending in -service (chart + Rollout + ArgoCD app name).
          pattern: '^[a-z][a-z0-9-]*-service$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One-line description of what the service does.
        owner:
          title: Owner
          type: string
          description: Team that owns the service.
          default: platform-team
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        imageRepository:
          title: Image repository
          type: string
          description: Full ECR image repo, e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/my-service.
  steps:
    - id: fetch
      name: Render the chart from the standard template
      action: fetch:template
      input:
        url: ./skeleton
        # The Helm templates under templates/ derive the service name from
        # .Chart.Name and use Helm's own {{ }} syntax — copy them verbatim so the
        # scaffolder never touches them. Everything else (Chart.yaml, values*,
        # values.schema.json, catalog-info.yaml) is rendered with the values below.
        copyWithoutRender:
          - '**/templates/**'
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          imageRepository: ${{ parameters.imageRepository }}
    - id: pr
      name: Open PR to SAAS-Continious-Delivery
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=huzaifa678&repo=SAAS-Continious-Delivery
        branchName: new-service-${{ parameters.name }}
        title: 'feat(service): scaffold ${{ parameters.name }} (golden path)'
        description: |
          Scaffolds the `${{ parameters.name }}` microservice from the standard
          chart — Argo Rollout + canary analysis, KEDA, Istio, probes,
          `values.schema.json` — plus its `catalog-info.yaml`.

          **Fully automated on merge — no manual wiring:**
          - the `microservices` ApplicationSet discovers services from `charts/*`,
            so this new chart directory auto-registers itself;
          - the `push-charts` workflow packages `charts/${{ parameters.name }}` and
            pushes it to the ECR OCI helm registry ArgoCD pulls from.

          Just build/push the service image; dev is then auto-promoted by
          argocd-image-updater (staging/prod via the promote-image template).

          Generated by the Backstage scaffolder.
  output:
    links:
      - title: Open the PR
        url: ${{ steps.pr.output.remoteUrl }}
