apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: promote-image
  title: Promote a Service Image
  description: >-
    The gated staging/prod promotion path. Fetches a service's current
    values-<env>.yaml from SAAS-Continious-Delivery, sets image.tag to the
    chosen build, and opens a PR. Merging it triggers the Argo Rollout canary
    for that environment. (Dev is auto-promoted by argocd-image-updater — use
    this for staging and prod.)
  tags:
    - promotion
    - deploy
    - gitops
spec:
  owner: group:default/platform-team
  type: task
  parameters:
    - title: What to promote
      required:
        - service
        - env
        - imageTag
      properties:
        service:
          title: Service
          type: string
          enum:
            - agent-service
            - auth-service
            - billing-service
            - subscription-service
            - usage-service
        env:
          title: Environment
          type: string
          description: Which environment to promote into (dev is automated).
          enum:
            - staging
            - prod
        imageTag:
          title: Image tag
          type: string
          description: The ECR image tag to promote (e.g. sha-6ac22f2).
          pattern: '^[a-zA-Z0-9._-]+$'
  steps:
    - id: fetch
      name: Fetch current values-${{ parameters.env }}.yaml
      action: fetch:plain:file
      input:
        url: https://github.com/huzaifa678/SAAS-Continious-Delivery/blob/main/charts/${{ parameters.service }}/values-${{ parameters.env }}.yaml
        targetPath: charts/${{ parameters.service }}/values-${{ parameters.env }}.yaml
    - id: bump
      name: Set image.tag
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: charts/${{ parameters.service }}/values-${{ parameters.env }}.yaml
            find: 'tag: ".*"'
            replaceWith: 'tag: "${{ parameters.imageTag }}"'
            matchRegex: true
    - id: pr
      name: Open promotion PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=huzaifa678&repo=SAAS-Continious-Delivery
        branchName: promote-${{ parameters.service }}-${{ parameters.env }}-${{ parameters.imageTag }}
        title: 'chore(promote): ${{ parameters.service }} ${{ parameters.env }} -> ${{ parameters.imageTag }}'
        description: |
          Promotes `${{ parameters.service }}` in **${{ parameters.env }}** to image
          tag `${{ parameters.imageTag }}`.

          Only `charts/${{ parameters.service }}/values-${{ parameters.env }}.yaml`
          (`image.tag`) changes. Merging triggers the Argo Rollout canary for this
          environment. Generated by the Backstage scaffolder.
  output:
    links:
      - title: Open the PR
        url: ${{ steps.pr.output.remoteUrl }}
