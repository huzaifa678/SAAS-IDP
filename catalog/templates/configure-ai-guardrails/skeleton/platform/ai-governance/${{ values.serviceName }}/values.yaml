# AI governance values overlay for ${{ values.serviceName }}.
# Generated by the "Configure AI Agent Guardrails" Backstage template.
#
# Wire this file into the service's Argo CD Application `valueFiles` (see README.md).
# On merge ArgoCD reconciles it and the harness flags take effect — no code redeploy.

# Harness toggles delivered as plain env (the agent-service application.properties reads
# each of these as a ${...} placeholder).
env:
  - name: OPA_BASE_URL
    value: "${{ values.opaBaseUrl }}"
  - name: AGENT_TOOLS_POLICY_ENABLED
    value: "${{ values.toolPolicyEnabled }}"
  - name: AGENT_GUARDRAIL_ENABLED
    value: "${{ values.guardrailEnabled }}"
  - name: AGENT_BUDGET_ENABLED
    value: "${{ values.budgetEnabled }}"
  - name: AGENT_BUDGET_MAX_TOKENS
    value: "${{ values.maxTokens }}"
  - name: AGENT_BUDGET_MAX_COST_USD
    value: "${{ values.maxCostUsd }}"
  # Fail-open / fail-closed posture is a Spring property (not a plain env placeholder),
  # so it is delivered through SPRING_APPLICATION_JSON, which Spring binds natively.
  - name: SPRING_APPLICATION_JSON
    value: '{"agent":{"tools":{"policy":{"fail-open":${{ values.failOpen }}}},"guardrail":{"fail-open":${{ values.failOpen }}}}}'
