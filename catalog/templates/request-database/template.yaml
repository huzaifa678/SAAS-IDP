apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-database
  title: Request a Postgres Database
  description: >-
    Self-service Postgres via Crossplane. Generates an AppDatabase claim (the
    platform.saas.example/v1alpha1 XRD) and opens a PR to SAAS-Continious-Delivery.
    Once merged, Crossplane provisions the database on the chosen RDS instance and
    writes a connection secret.
  tags:
    - database
    - postgres
    - crossplane
    - gitops
spec:
  owner: group:default/platform-team
  type: resource
  parameters:
    - title: Database
      required:
        - databaseName
        - owner
        - instance
      properties:
        databaseName:
          title: Database name
          type: string
          description: Lowercase + underscores, max 63 chars.
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        owner:
          title: Owner role
          type: string
          description: Postgres role that owns the database (lowercase + underscores).
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        instance:
          title: RDS instance
          type: string
          description: Which RDS instance the database is created in.
          enum:
            - auth
            - billing
            - subscription
            - usage
            - keycloak
            - airflow
        extensions:
          title: Postgres extensions
          type: array
          description: Optional extensions to enable (e.g. uuid-ossp, pgcrypto).
          items:
            type: string
          default: []
        namespace:
          title: Kubernetes namespace
          type: string
          description: Namespace the claim (and connection secret) live in.
          default: saas-apps
  steps:
    - id: fetch
      name: Generate the AppDatabase claim
      action: fetch:template
      input:
        url: ./skeleton
        values:
          databaseName: ${{ parameters.databaseName }}
          owner: ${{ parameters.owner }}
          instance: ${{ parameters.instance }}
          extensions: ${{ parameters.extensions }}
          namespace: ${{ parameters.namespace }}
    - id: pr
      name: Open PR to SAAS-Continious-Delivery
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=huzaifa678&repo=SAAS-Continious-Delivery
        branchName: db-${{ parameters.databaseName }}
        title: 'feat(db): provision ${{ parameters.databaseName }} on rds-${{ parameters.instance }}'
        description: |
          Adds a Crossplane `AppDatabase` claim for `${{ parameters.databaseName }}`
          (owner `${{ parameters.owner }}`) on the `${{ parameters.instance }}` RDS
          instance. Generated by the Backstage scaffolder.

          After merge, ArgoCD/Crossplane reconciles the claim and writes the
          connection secret `${{ parameters.databaseName }}-conn` into
          `${{ parameters.namespace }}`.
  output:
    links:
      - title: Open the PR
        url: ${{ steps.pr.output.remoteUrl }}
