---
# Generated by the Backstage "Request a Postgres Database" scaffolder template.
# A Crossplane claim against the xappdatabases XRD — Crossplane provisions the
# database on the rds-${{ values.instance }} ProviderConfig and writes a
# connection secret with the keys declared by the XRD (username/password/host/
# port/database/dsn).
apiVersion: platform.saas.example/v1alpha1
kind: AppDatabase
metadata:
  name: ${{ values.databaseName }}
  namespace: ${{ values.namespace }}
spec:
  parameters:
    databaseName: ${{ values.databaseName }}
    owner: ${{ values.owner }}
    instance: ${{ values.instance }}
    {%- if values.extensions and values.extensions | length > 0 %}
    extensions:
      {%- for ext in values.extensions %}
      - ${{ ext }}
      {%- endfor %}
    {%- endif %}
  writeConnectionSecretToRef:
    name: ${{ values.databaseName }}-conn
