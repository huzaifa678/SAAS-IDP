---
# Generated by the Backstage "Request a Redis Cache" scaffolder template.
# A Crossplane claim against the xappcaches XRD. The function-appcache pipeline
# branches on spec.parameters.mode: shared -> a key-prefix-scoped RBAC user on
# the platform's shared cluster; dedicated -> the service's own ElastiCache
# ReplicationGroup. Crossplane writes a connection secret with the XRD keys
# (host/port/username/prefix; host/port only in dedicated mode).
apiVersion: platform.saas.example/v1alpha1
kind: AppCache
metadata:
  name: ${{ values.serviceName }}-cache
  namespace: ${{ values.namespace }}
spec:
  parameters:
    serviceName: ${{ values.serviceName }}
    mode: ${{ values.mode }}
    keyPrefix: ${{ values.keyPrefix or values.serviceName }}
    region: ${{ values.region }}
    {%- if values.mode == "dedicated" %}
    nodeType: ${{ values.nodeType }}
    numShards: ${{ values.numShards }}
    numReplicas: ${{ values.numReplicas }}
    subnetGroupName: ${{ values.subnetGroupName }}
    securityGroupIds:
      {%- for sg in values.securityGroupIds %}
      - ${{ sg }}
      {%- endfor %}
    kmsKeyId: ${{ values.kmsKeyId }}
    {%- endif %}
  writeConnectionSecretToRef:
    name: ${{ values.serviceName }}-cache-conn
