apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-cache
  title: Request a Redis Cache
  description: >-
    Self-service ElastiCache via Crossplane. Generates an AppCache claim (the
    platform.saas.example/v1alpha1 XRD) and opens a PR to SAAS-Continious-Delivery.
    Shared mode adds a key-prefix-scoped RBAC user on the platform's shared Redis;
    dedicated mode provisions the service its own cluster. Once merged, Crossplane
    reconciles the claim and writes a connection secret.
  tags:
    - cache
    - redis
    - elasticache
    - crossplane
    - gitops
spec:
  owner: group:default/platform-team
  type: resource
  parameters:
    - title: Cache
      required:
        - serviceName
        - mode
      properties:
        serviceName:
          title: Service name
          type: string
          description: Owning service. Becomes the ACL username (shared) or cluster id (dedicated).
          pattern: '^[a-z][a-z0-9-]{0,38}$'
        mode:
          title: Mode
          type: string
          description: >-
            shared = an ACL user scoped to a key prefix on the shared cluster
            (cheap, fast). dedicated = the service's own ElastiCache cluster
            (isolated, costlier).
          enum:
            - shared
            - dedicated
          enumNames:
            - 'shared — RBAC tenant on the shared cluster'
            - 'dedicated — the service''s own cluster'
          default: shared
        keyPrefix:
          title: Key prefix
          type: string
          description: Key namespace the cache is scoped to (~<prefix>:*). Defaults to the service name.
          pattern: '^[a-z][a-z0-9:_-]{0,48}$'
        namespace:
          title: Kubernetes namespace
          type: string
          description: Namespace the claim (and connection secret) live in.
          default: saas-apps
        region:
          title: AWS region
          type: string
          default: us-east-1
    - title: Dedicated cluster options
      description: Only used when mode = dedicated. Ignored for shared.
      properties:
        nodeType:
          title: Node type
          type: string
          default: cache.t4g.medium
        numShards:
          title: Shards (node groups)
          type: integer
          description: '>1 enables Redis Cluster mode (hash-slot sharding).'
          default: 1
          minimum: 1
        numReplicas:
          title: Replicas per shard
          type: integer
          default: 1
          minimum: 0
        subnetGroupName:
          title: Subnet group
          type: string
          description: Existing ElastiCache subnet group (from infra).
          default: saas-redis-subnet-group
        securityGroupIds:
          title: Security group IDs
          type: array
          items:
            type: string
          default: []
        kmsKeyId:
          title: KMS key ARN
          type: string
          description: KMS key for at-rest encryption of the dedicated cluster.
  steps:
    - id: fetch
      name: Generate the AppCache claim
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          mode: ${{ parameters.mode }}
          keyPrefix: ${{ parameters.keyPrefix }}
          namespace: ${{ parameters.namespace }}
          region: ${{ parameters.region }}
          nodeType: ${{ parameters.nodeType }}
          numShards: ${{ parameters.numShards }}
          numReplicas: ${{ parameters.numReplicas }}
          subnetGroupName: ${{ parameters.subnetGroupName }}
          securityGroupIds: ${{ parameters.securityGroupIds }}
          kmsKeyId: ${{ parameters.kmsKeyId }}
    - id: pr
      name: Open PR to SAAS-Continious-Delivery
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=huzaifa678&repo=SAAS-Continious-Delivery
        branchName: cache-${{ parameters.serviceName }}
        title: 'feat(cache): provision ${{ parameters.mode }} Redis for ${{ parameters.serviceName }}'
        description: |
          Adds a Crossplane `AppCache` claim for `${{ parameters.serviceName }}`
          in **${{ parameters.mode }}** mode. Generated by the Backstage scaffolder.

          After merge, ArgoCD/Crossplane reconciles the claim and writes the
          connection secret `${{ parameters.serviceName }}-cache-conn` into
          `${{ parameters.namespace }}`.
  output:
    links:
      - title: Open the PR
        url: ${{ steps.pr.output.remoteUrl }}
