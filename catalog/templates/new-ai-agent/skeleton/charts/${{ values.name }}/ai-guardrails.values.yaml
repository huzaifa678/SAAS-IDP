# Guardrail overlay for the AI agent ${{ values.name }}.
# Generated by the "New AI Agent (golden path)" Backstage template.
#
# Layers on the standard microservice chart's values. Add it to the service's Argo CD
# Application `valueFiles` after the base values.yaml.

# LLM provider / model.
env:
  - name: AGENT_PROVIDER
    value: "${{ values.provider }}"
  - name: AGENT_MODEL
    value: "${{ values.model }}"

  # --- Harness: memory / tool / I/O governance all ON from day one ---
  - name: OPA_BASE_URL
    value: "http://localhost:8181"
  - name: AGENT_MEMORY_POLICY_ENABLED
    value: "true"
  - name: AGENT_TOOLS_POLICY_ENABLED
    value: "true"
  - name: AGENT_GUARDRAIL_ENABLED
    value: "true"
  - name: AGENT_BUDGET_ENABLED
    value: "true"
  - name: AGENT_BUDGET_MAX_TOKENS
    value: "${{ values.maxTokens }}"
  - name: AGENT_BUDGET_MAX_COST_USD
    value: "${{ values.maxCostUsd }}"
  # Fail-open / fail-closed posture (Spring property, delivered via SPRING_APPLICATION_JSON).
  - name: SPRING_APPLICATION_JSON
    value: '{"agent":{"memory":{"policy":{"fail-open":${{ values.failOpen }}}},"tools":{"policy":{"fail-open":${{ values.failOpen }}}},"guardrail":{"fail-open":${{ values.failOpen }}}}}'

# OPA sidecar: evaluates the agent/memory, agent/tools and agent/io Rego bundle on the
# runtime path. The policy bundle itself is versioned in the agent-service repo under
# policy/agent and delivered to the sidecar as a ConfigMap / OPA bundle.
extraContainers:
  - name: opa
    image: openpolicyagent/opa:0.70.0
    args:
      - run
      - --server
      - --addr=localhost:8181
      - --config-file=/config/opa-config.yaml
      - /policy
    ports:
      - containerPort: 8181
    volumeMounts:
      - name: agent-policy
        mountPath: /policy
        readOnly: true
      - name: opa-config
        mountPath: /config
        readOnly: true

extraVolumes:
  - name: agent-policy
    configMap:
      name: ${{ values.name }}-agent-policy
  - name: opa-config
    configMap:
      name: ${{ values.name }}-opa-config
