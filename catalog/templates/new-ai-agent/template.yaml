apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-ai-agent
  title: New AI Agent (golden path)
  description: >-
    Scaffold an AI agent service pre-wired with the guardrail harness: an OPA sidecar,
    the memory / tool / I/O governance env flags, a starter per-tenant OPA data
    document, and a catalog-info.yaml of type ai-service. Opened as a PR to
    SAAS-Continious-Delivery. Layers on the standard microservice chart (run "New
    Microservice" for the base chart, shown in the PR body). See TechDocs: AI
    guardrails golden path.
  tags:
    - ai
    - agent
    - guardrails
    - golden-path
    - gitops
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase DNS name ending in -service.
          pattern: '^[a-z][a-z0-9-]*-service$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One-line description of what the agent does.
        owner:
          title: Owner
          type: string
          default: platform-team
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
    - title: Model
      required:
        - provider
        - model
      properties:
        provider:
          title: LLM provider
          type: string
          enum:
            - openai
            - anthropic
          default: openai
        model:
          title: Model
          type: string
          description: Default chat model id.
          default: gpt-4o
    - title: Guardrail defaults
      properties:
        failOpen:
          title: Fail-open when OPA is unreachable
          type: boolean
          description: false = fail-closed (safe default); true = fail-open.
          default: false
        maxTokens:
          title: Max tokens per conversation
          type: integer
          description: Cumulative token ceiling; 0 = unlimited.
          default: 0
          minimum: 0
        maxCostUsd:
          title: Max cost per conversation (USD)
          type: string
          description: Cumulative cost ceiling in USD; 0 = unlimited.
          default: "0"
          pattern: '^[0-9]+(\.[0-9]{1,4})?$'
  steps:
    - id: fetch
      name: Render the AI agent governance scaffold
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          provider: ${{ parameters.provider }}
          model: ${{ parameters.model }}
          failOpen: ${{ parameters.failOpen }}
          maxTokens: ${{ parameters.maxTokens }}
          maxCostUsd: ${{ parameters.maxCostUsd }}
    - id: pr
      name: Open PR to SAAS-Continious-Delivery
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=huzaifa678&repo=SAAS-Continious-Delivery
        branchName: new-ai-agent-${{ parameters.name }}
        title: 'feat(ai): scaffold AI agent ${{ parameters.name }} (golden path)'
        description: |
          Scaffolds the `${{ parameters.name }}` AI agent with the guardrail harness
          pre-wired, under `charts/${{ parameters.name }}/`:

          - `ai-guardrails.values.yaml` — OPA sidecar + the memory / tool / I/O harness
            env flags **on** by default (fail-open: `${{ parameters.failOpen }}`,
            budget tokens: `${{ parameters.maxTokens }}`, cost USD:
            `${{ parameters.maxCostUsd }}`), plus provider/model
            (`${{ parameters.provider }}` / `${{ parameters.model }}`).
          - `policy/tenant-governance.json` — starter OPA tenant data document.
          - `catalog-info.yaml` — a `Component` of type `ai-service`, in the
            `ai-platform` system, with the governance policy bundle noted.

          **Base chart**: this overlay layers on the standard microservice chart. Run
          the **New Microservice** template for `${{ parameters.name }}` first (or
          merge both PRs together), then add `ai-guardrails.values.yaml` to the Argo CD
          Application `valueFiles`.

          Generated by the Backstage scaffolder. See TechDocs: AI guardrails golden path.
  output:
    links:
      - title: Open the PR
        url: ${{ steps.pr.output.remoteUrl }}
